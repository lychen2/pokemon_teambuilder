name: 验证

# 每次推送与合并前跑类型检查、单元测试和一次完整构建。
# 生成资产（assets/bootstrap.json、assets/engines/ 等）随仓库提交，因此这里不需要联网同步数据。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / 单元测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查与单元测试
        run: pnpm verify
      - name: 构建
        run: pnpm build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/**
          retention-days: 7
