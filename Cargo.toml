[workspace]
members = [
  "crates/poke-type-core",
  "crates/poke-type-cli",
  "crates/poke-type-web",
  "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
